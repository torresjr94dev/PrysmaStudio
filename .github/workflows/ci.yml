name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el CI solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Acciones fijadas por SHA (los tags son mutables). Al actualizar, cambia SHA y comentario juntos.
jobs:
  web:
    name: Motor y PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}

  server:
    name: Servidor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  e2e:
    name: E2E contra el stack de producción
    needs: [web, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRYSMA_DOMAIN: localhost
      PRYSMA_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      PRYSMA_HTTP_PORT: "8088"
      PRYSMA_HTTPS_PORT: "8443"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Levantar Caddy + servidor + Gotenberg
        run: docker compose -f deploy/compose.yaml -p prysmastudio-ci up -d --build --wait
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prysmastudio/web exec playwright install --with-deps chromium
      - name: Playwright (CSP real, OCR y LibreOffice incluidos)
        run: pnpm --filter @prysmastudio/web e2e
        env:
          E2E_BASE_URL: https://localhost:8443
      - name: Logs del stack
        if: failure()
        run: docker compose -f deploy/compose.yaml -p prysmastudio-ci logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
