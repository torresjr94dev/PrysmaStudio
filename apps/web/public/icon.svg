<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Isotipo «Refraction Monolith» (propuesta): romboide continuo con trazo fino, relleno translúcido al 12 %
       y un bisel a 45° en degradado de zafiro. Sin metáforas de oficina. -->
  <style>
    .rim { stroke: #f4f5f7; }
    .core { fill: #8ea89d; fill-opacity: 0.12; }
    @media (prefers-color-scheme: light) {
      .rim { stroke: #1a1c1c; }
      .core { fill: #436054; }
    }
  </style>
  <defs>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d92a0" stop-opacity="0" />
      <stop offset="0.5" stop-color="#7d92a0" stop-opacity="0.9" />
      <stop offset="1" stop-color="#7d92a0" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect class="core rim" x="14" y="14" width="36" height="36" rx="11" transform="rotate(45 32 32)" stroke-width="2.5" />
  <path d="M19 45 45 19" stroke="url(#bevel)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M24 16.5c2.6-2.1 5.4-3.3 8-3.5" class="rim" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
</svg>
