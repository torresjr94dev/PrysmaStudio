<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Isotipo de PrysmaStudio: la versión vectorial del logo (prisma de vidrio, haz blanco que entra por
       la izquierda y espectro que sale a la derecha). Para favicon, cabecera y tamaños pequeños, donde el
       render 3D se empasta. En modo claro el haz deja de ser blanco para no desaparecer. -->
  <style>
    .beam { stroke: #ffffff; }
    .beam-glow { stroke: #ffffff; opacity: 0.35; }
    @media (prefers-color-scheme: light) {
      .beam { stroke: #5b6b8c; }
      .beam-glow { stroke: #5b6b8c; opacity: 0.22; }
    }
  </style>
  <defs>
    <linearGradient id="glass" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#c7d6ff" />
      <stop offset="0.38" stop-color="#3d5be0" />
      <stop offset="0.7" stop-color="#5a2fd4" />
      <stop offset="1" stop-color="#22c3f0" />
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e14ef5" />
      <stop offset="0.3" stop-color="#7a4dff" />
      <stop offset="0.55" stop-color="#2b86ff" />
      <stop offset="0.78" stop-color="#19e3ff" />
      <stop offset="1" stop-color="#5df0a8" />
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.35" />
    </linearGradient>
    <mask id="spectrum-fade">
      <rect x="44" y="12" width="20" height="40" fill="url(#fade)" />
    </mask>
  </defs>
  <!-- Espectro -->
  <polygon points="45,33.5 64,17 64,44" fill="url(#spectrum)" mask="url(#spectrum-fade)" />
  <!-- Haz de entrada -->
  <line x1="0" y1="28.5" x2="20" y2="33.5" class="beam-glow" stroke-width="4.5" stroke-linecap="round" />
  <line x1="0" y1="28.5" x2="20" y2="33.5" class="beam" stroke-width="1.8" stroke-linecap="round" />
  <!-- Prisma -->
  <polygon points="32,8 58.5,53 5.5,53" fill="url(#glass)" stroke="#e6ecff" stroke-opacity="0.9" stroke-width="1.3" stroke-linejoin="round" />
  <!-- Facetas: cara izquierda clara y arista interior -->
  <polygon points="32,8 32,40 5.5,53" fill="#ffffff" fill-opacity="0.16" />
  <polygon points="32,40 58.5,53 5.5,53" fill="#0b1030" fill-opacity="0.28" />
  <path d="M32 8 32 40" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8" />
  <!-- Brillo en la arista superior izquierda -->
  <path d="M30.5 12.5 18 34" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round" />
</svg>
