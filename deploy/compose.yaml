name: prysmastudio

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_SOURCE_URL: ${PRYSMA_SOURCE_URL:?Define PRYSMA_SOURCE_URL con la URL pública del repositorio (AGPL)}
    environment:
      PRYSMA_DOMAIN: ${PRYSMA_DOMAIN:?Define PRYSMA_DOMAIN (p. ej. pdf.tudominio.mx)}
      PRYSMA_MAX_UPLOAD_MB: ${PRYSMA_MAX_UPLOAD_MB:-100}
    ports:
      - "${PRYSMA_HTTP_PORT:-80}:80"
      - "${PRYSMA_HTTPS_PORT:-443}:443"
      - "${PRYSMA_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, internal]
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      PRYSMA_GOTENBERG_URL: http://gotenberg:3000
      PRYSMA_TRUST_PROXY: "true"
      PRYSMA_MAX_UPLOAD_MB: ${PRYSMA_MAX_UPLOAD_MB:-100}
      PRYSMA_MAX_PAGES: ${PRYSMA_MAX_PAGES:-300}
      PRYSMA_MAX_CONCURRENT_JOBS: ${PRYSMA_MAX_CONCURRENT_JOBS:-2}
      PRYSMA_JOB_TTL_SECONDS: ${PRYSMA_JOB_TTL_SECONDS:-3600}
      PRYSMA_JOBS_PER_MINUTE_PER_IP: ${PRYSMA_JOBS_PER_MINUTE_PER_IP:-10}
      PRYSMA_OCR_THREADS: ${PRYSMA_OCR_THREADS:-2}
      # Instancia privada para "ciertos particulares": hashes SHA-256 de las llaves, separados por comas.
      PRYSMA_ACCESS_KEYS_SHA256: ${PRYSMA_ACCESS_KEYS_SHA256:-}
    # Sin salida a internet: solo habla con Caddy y Gotenberg.
    networks: [internal]
    read_only: true
    tmpfs:
      - /work:size=${PRYSMA_WORK_TMPFS:-2g},uid=10001,gid=10001,mode=0700
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${PRYSMA_SERVER_MEMORY:-4g}
    pids_limit: 512
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.38.1-libreoffice
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-restart-after=10
      - --log-level=warn
    # LibreOffice no puede cargar recursos remotos incrustados en documentos: no hay red de salida.
    networks: [internal]
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${PRYSMA_GOTENBERG_MEMORY:-2g}
    pids_limit: 256
    restart: unless-stopped

networks:
  edge: {}
  internal:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
